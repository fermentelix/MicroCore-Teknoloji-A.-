<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroCore Teknoloji A.Ş. (G02) | B2B & B2C E-Ticaret Portalı</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --dark-card: #0b1329;
            --dark-card-inner: #111c38;
            --cyan-accent: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        /* YARIM EKRAN KAYMASINI ÖNLEYEN KOD BURASI */
        body {
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden; 
        }

        /* --- HEADER & NAV --- */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand span.tag {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            margin-left: 1.5rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }
        
        .cart-nav-btn {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            margin-left: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid #bfdbfe;
        }

        /* --- GENEL YAPI --- */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        section {
            padding: 4rem 0;
            border-bottom: 1px solid var(--border);
        }
        section:last-child {
            border-bottom: none;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .section-header p {
            color: var(--text-muted);
            margin-top: 0.3rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- HERO (ANA SAYFA) --- */
        .hero {
            text-align: center;
            padding: 4rem 1rem 5rem 1rem;
            background: linear-gradient(180deg, #ffffff 0%, var(--background) 100%);
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto 2rem auto;
        }

        .badge-main {
            display: inline-block;
            background-color: #dbeafe;
            color: var(--accent);
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* --- HOCANIN İSTEDİĞİ YENİ KPI (PERFORMANS) BÖLÜMÜ --- */
        .kpi-section {
            background-color: #0b1329;
            padding: 3rem 1.5rem;
            border-top: 1px solid #1e293b;
            border-bottom: 1px solid #1e293b;
        }

        .kpi-grid {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .kpi-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        
        .kpi-value.green { color: #34d399; }
        .kpi-value.purple { color: #c084fc; }

        .kpi-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- HAKKIMIZDA & KARTLAR --- */
        .grid-2 {
